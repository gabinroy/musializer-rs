<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0B0D13">
    <link data-trunk rel="rust" data-target-name="musializer_rs" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="icon" href="assets/icon.png" />
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <title>Musializer-RS | High-Performance Audio Visualizer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0B0D13;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
        }

        #musializer_canvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: 500;
            color: #00F0FF;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #loading img {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.4);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1.0); box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 0 32px rgba(0, 240, 255, 0.6); }
        }
    </style>
</head>
<body>
    <canvas id="musializer_canvas"></canvas>
    <div id="loading">
        <img src="assets/icon.png" alt="Musializer-RS Logo">
        <div>⚡ Loading Musializer-RS (WASM GPU Engine)...</div>
    </div>
</body>
</html>
