name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes (Leave empty to auto-generate or use draft)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Desktop Multi-Platform Matrix (Linux, Windows, macOS)
  # -------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_type: linux
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_type: windows
          - name: macOS Apple Silicon (M-Series)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_type: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform.artifact_type == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev squashfs-tools

      # Build binaries and packages
      - name: Install cargo packaging tools
        run: |
          cargo install cargo-deb cargo-generate-rpm || true

      - name: Build Desktop Release
        run: |
          cargo build --release --target ${{ matrix.platform.target }} --package musializer-desktop

      # Linux Packages (.deb, .rpm, .tar.gz)
      - name: Package Linux (.deb, .rpm, .tar.gz)
        if: matrix.platform.artifact_type == 'linux'
        run: |
          mkdir -p dist
          cargo deb --target ${{ matrix.platform.target }} -p musializer-desktop -o dist/musializer-rs-amd64.deb || true
          
          # Generate RPM package from workspace release binary
          (cd crates/musializer-desktop && cargo generate-rpm --target-dir ../../target --target ${{ matrix.platform.target }} --auto-req disabled -o ../../dist/musializer-rs.x86_64.rpm) || true
          
          tar -czf dist/musializer-rs-linux-x86_64.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      # Windows Packages (.exe, .zip)
      - name: Package Windows (.zip)
        if: matrix.platform.artifact_type == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.platform.target }}/release/musializer-rs.exe dist/musializer-rs.exe
          cd target/${{ matrix.platform.target }}/release
          7z a ../../../dist/musializer-rs-windows-x86_64.zip musializer-rs.exe

      # macOS Packages (.app, .dmg, .tar.gz)
      - name: Package macOS (.dmg, .app.zip, .tar.gz)
        if: matrix.platform.artifact_type == 'macos'
        run: |
          mkdir -p dist
          
          # Create macOS App Bundle manually & via hdiutil DMG
          APP_DIR="dist/Musializer-RS.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"
          
          # Copy binary & icon
          cp target/${{ matrix.platform.target }}/release/musializer-rs "$APP_DIR/MacOS/musializer-rs"
          chmod +x "$APP_DIR/MacOS/musializer-rs"
          cp assets/icon.png "$APP_DIR/Resources/icon.png"
          
          # Create Info.plist
          cat << 'EOF_PLIST' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>musializer-rs</string>
              <key>CFBundleIdentifier</key>
              <string>org.musializer.MusializerRS</string>
              <key>CFBundleName</key>
              <string>Musializer-RS</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF_PLIST
          
          # Package .dmg disk image using hdiutil
          hdiutil create -volname "Musializer-RS" -srcfolder "dist/Musializer-RS.app" -ov -format UDZO dist/musializer-rs-macos-arm64.dmg
          
          # Package .app.zip
          cd dist
          zip -r musializer-rs-macos-arm64.app.zip Musializer-RS.app
          rm -rf Musializer-RS.app
          cd ..
          
          tar -czf dist/musializer-rs-macos-arm64.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.artifact_type }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2. Mobile Android Build (APK Universal & Split-ABI)
  # -------------------------------------------------------------------------
  build-android:
    name: Build Mobile (Android APKs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Rust toolchains for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Native Rust Libraries for Android
        run: |
          cd crates/musializer-core
          ./build-android.sh

      - name: Build Android Release APK (Universal & Split ABI)
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Package Android APKs
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/musializer-mobile-universal.apk || true
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/musializer-mobile-arm64-v8a.apk || true
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/musializer-mobile-armeabi-v7a.apk || true
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/musializer-mobile-x86_64.apk || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-mobile
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3. Mobile iOS Build (Runner.app / .ipa bundle validation)
  # -------------------------------------------------------------------------
  build-ios:
    name: Build Mobile (iOS No-Codesign Archive)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Rust targets for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Compile Native Rust for iOS
        run: |
          cd crates/musializer-core
          ./build-ios.sh

      - name: Build Flutter iOS Release (No Codesign)
        run: |
          cd mobile
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package iOS Runner (.ipa / .zip)
        run: |
          mkdir -p dist
          
          # Create Payload directory for sideloadable .ipa
          mkdir -p Payload
          cp -r mobile/build/ios/iphoneos/Runner.app Payload/
          zip -r dist/musializer-mobile-ios-unsigned.ipa Payload
          rm -rf Payload
          
          # Zip Runner.app directly
          cd mobile/build/ios/iphoneos
          zip -r ../../../../dist/musializer-mobile-ios-Runner.app.zip Runner.app || true

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-ios-mobile
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 4. Unified Release Publisher
  # -------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Determine Tag & Release Details
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="${{ github.event.inputs.tag_name }}"
            fi
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=$TAG" >> $GITHUB_OUTPUT
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ steps.release_info.outputs.notes }}
          generate_release_notes: true
          files: all-dist/*
