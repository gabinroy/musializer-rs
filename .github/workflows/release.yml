name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes (Leave empty to auto-generate or use draft)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # 1. Desktop Multi-Platform Matrix (Linux, Windows, macOS)
  # -------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_type: linux
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_type: windows
          - name: macOS Apple Silicon (M-Series)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_type: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform.artifact_type == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev squashfs-tools

      # Build binaries and packages
      - name: Install cargo tools (cargo-bundle, cargo-deb, cargo-generate-rpm)
        run: |
          cargo install cargo-bundle
          if [ "${{ matrix.platform.artifact_type }}" = "linux" ]; then
            cargo install cargo-deb
            cargo install cargo-generate-rpm
          fi
        shell: bash

      # Linux & macOS bundling
      - name: Build and Bundle (Linux & macOS)
        if: matrix.platform.artifact_type != 'windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          cargo bundle --release --target ${{ matrix.platform.target }}

      # Windows: build release binary (and optional bundle without failing)
      - name: Build Release (Windows)
        if: matrix.platform.artifact_type == 'windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          cargo bundle --release --target ${{ matrix.platform.target }} || true

      # Prepare artifacts for upload
      - name: Package Linux Artifacts (.deb, .rpm, .AppImage, .tar.gz)
        if: matrix.platform.artifact_type == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cargo deb --target ${{ matrix.platform.target }} --no-build -o dist/ || true
          cargo generate-rpm --target ${{ matrix.platform.target }} -o dist/ || true
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.AppImage" -exec cp {} dist/ \; || true
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.deb" -exec cp {} dist/ \; || true
          tar -czf dist/musializer-rs-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      - name: Package Windows Artifacts
        if: matrix.platform.artifact_type == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.msi" -exec cp {} dist/ \; || true
          cd target/${{ matrix.platform.target }}/release
          7z a ../../../../dist/musializer-rs-${{ matrix.platform.target }}.zip musializer-rs.exe

      - name: Package macOS Artifacts
        if: matrix.platform.artifact_type == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          if [ -d "target/${{ matrix.platform.target }}/release/bundle/osx" ]; then
            cd target/${{ matrix.platform.target }}/release/bundle/osx
            zip -r ../../../../../dist/musializer-rs-${{ matrix.platform.target }}.app.zip *.app || true
            APP_NAME=$(find . -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_NAME" ]; then
              npm install --global create-dmg || true
              create-dmg "$APP_NAME" ../../../../../dist/ --overwrite || hdiutil create -volname "Musializer-RS" -srcfolder "$APP_NAME" -ov -format UDZO ../../../../../dist/musializer-rs-${{ matrix.platform.target }}.dmg || true
              find . -maxdepth 1 -name "*.dmg" -exec cp {} ../../../../../dist/ \; || true
            fi
            cd -
          fi
          tar -czf dist/musializer-rs-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2. Mobile Android Build (Universal & Split APKs)
  # -------------------------------------------------------------------------
  build-android:
    name: Build Mobile (Android APK)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Rust toolchains for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Native Rust Libraries for Android
        run: |
          cd crates/musializer-core
          ./build-android.sh

      - name: Build Android Release APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Package Android APKs
        run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/musializer-mobile-arm64-v8a.apk || true
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/musializer-mobile-armeabi-v7a.apk || true
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/musializer-mobile-x86_64.apk || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-android-mobile
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3. Mobile iOS Build (Runner.app / .ipa bundle validation)
  # -------------------------------------------------------------------------
  build-ios:
    name: Build Mobile (iOS No-Codesign Archive)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Rust targets for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Compile Native Rust for iOS
        run: |
          cd crates/musializer-core
          ./build-ios.sh

      - name: Build Flutter iOS Release (No Codesign)
        run: |
          cd mobile
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package iOS Runner
        run: |
          mkdir -p dist
          cd mobile/build/ios/iphoneos
          zip -r ../../../../dist/musializer-mobile-ios-unsigned.zip Runner.app || true

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-ios-mobile
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 4. Unified Release Publisher
  # -------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Determine Tag & Release Details
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="${{ github.event.inputs.tag_name }}"
            fi
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=$TAG" >> $GITHUB_OUTPUT
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ steps.release_info.outputs.notes }}
          generate_release_notes: true
          files: all-dist/*
