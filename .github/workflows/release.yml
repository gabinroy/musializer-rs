name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes (Leave empty to auto-generate or use draft)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_type: linux
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_type: windows
          - name: macOS Apple Silicon (M-Series)
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_type: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform.artifact_type == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libwayland-dev libxkbcommon-dev squashfs-tools

      # Build binaries and packages
      - name: Install cargo tools (cargo-bundle, cargo-deb, cargo-generate-rpm)
        run: |
          cargo install cargo-bundle
          if [ "${{ matrix.platform.artifact_type }}" = "linux" ]; then
            cargo install cargo-deb
            cargo install cargo-generate-rpm
          fi
        shell: bash

      # Linux & macOS bundling
      - name: Build and Bundle (Linux & macOS)
        if: matrix.platform.artifact_type != 'windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          cargo bundle --release --target ${{ matrix.platform.target }}

      # Windows: build release binary (and optional bundle without failing)
      - name: Build Release (Windows)
        if: matrix.platform.artifact_type == 'windows'
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.platform.target }}
          cargo bundle --release --target ${{ matrix.platform.target }} || true

      # Prepare artifacts for upload
      - name: Package Linux Artifacts (.deb, .rpm, .AppImage, .tar.gz)
        if: matrix.platform.artifact_type == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          # Copy .deb from bundle if present, or generate with cargo-deb
          cargo deb --target ${{ matrix.platform.target }} --no-build -o dist/ || true
          cargo generate-rpm --target ${{ matrix.platform.target }} -o dist/ || true
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.AppImage" -exec cp {} dist/ \; || true
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.deb" -exec cp {} dist/ \; || true
          tar -czf dist/musializer-rs-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      - name: Package Windows Artifacts
        if: matrix.platform.artifact_type == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          find target/${{ matrix.platform.target }}/release/bundle/ -name "*.msi" -exec cp {} dist/ \; || true
          cd target/${{ matrix.platform.target }}/release
          7z a ../../../../dist/musializer-rs-${{ matrix.platform.target }}.zip musializer-rs.exe

      - name: Package macOS Artifacts
        if: matrix.platform.artifact_type == 'macos'
        shell: bash
        run: |
          mkdir -p dist
          if [ -d "target/${{ matrix.platform.target }}/release/bundle/osx" ]; then
            cd target/${{ matrix.platform.target }}/release/bundle/osx
            # 1. Zip the .app bundle
            zip -r ../../../../../dist/musializer-rs-${{ matrix.platform.target }}.app.zip *.app || true
            
            # 2. Create .dmg disk image installer
            APP_NAME=$(find . -maxdepth 1 -name "*.app" | head -n 1)
            if [ -n "$APP_NAME" ]; then
              npm install --global create-dmg || true
              create-dmg "$APP_NAME" ../../../../../dist/ --overwrite || hdiutil create -volname "Musializer-RS" -srcfolder "$APP_NAME" -ov -format UDZO ../../../../../dist/musializer-rs-${{ matrix.platform.target }}.dmg || true
              find . -maxdepth 1 -name "*.dmg" -exec cp {} ../../../../../dist/ \; || true
            fi
            cd -
          fi
          tar -czf dist/musializer-rs-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release musializer-rs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Determine Tag & Release Details
        id: release_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            TITLE="${{ github.event.inputs.release_title }}"
            if [ -z "$TITLE" ]; then
              TITLE="${{ github.event.inputs.tag_name }}"
            fi
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "title=$TAG" >> $GITHUB_OUTPUT
            echo "notes=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body: ${{ steps.release_info.outputs.notes }}
          generate_release_notes: true
          files: all-dist/*

  aur-publish:
    name: Publish to Arch User Repository (AUR)
    needs: [publish]
    runs-on: ubuntu-latest
    # Temporarily paused until AUR new account registration reopens
    if: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Tag
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          sed -i "s/pkgver=.*/pkgver=${{ steps.vars.outputs.tag }}/" distribution/aur/PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/" distribution/aur/PKGBUILD

      - name: Deploy to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        if: env.AUR_KEY != ''
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        with:
          pkgname: musializer-rs-bin
          pkgbuild: distribution/aur/PKGBUILD
          commit_username: 'gabinroy'
          commit_email: 'gabinroy@users.noreply.github.com'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.vars.outputs.tag }}"

  winget-publish:
    name: Publish to Windows Winget
    needs: [publish]
    runs-on: ubuntu-latest
    # Optional: Disabled in favor of direct installer downloads (.msi, .zip/.exe)
    if: false
    steps:
      - name: Submit Winget Package Update
        uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: GabinRoy.MusializerRS
          version: ${{ github.ref_name }}
          installers-regex: '.*-x86_64-pc-windows-msvc\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
