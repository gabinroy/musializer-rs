[package]
name = "musializer-desktop"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "High-Performance GPU-Accelerated Audio Visualizer in Rust"
homepage = "https://github.com/gabinroy/musializer-rs"
repository = "https://github.com/gabinroy/musializer-rs"

[[bin]]
name = "musializer-rs"
path = "src/main.rs"

[package.metadata.rpm]
package = "musializer-rs"

[package.metadata.rpm.files]
"../../assets/icon.png" = { path = "/usr/share/icons/hicolor/256x256/apps/musializer-rs.png" }
"../../distribution/org.musializer.MusializerRS.desktop" = { path = "/usr/share/applications/musializer-rs.desktop" }

[package.metadata.deb]
name = "musializer-rs"
maintainer = "G Abin Roy <gabinroy@users.noreply.github.com>"
assets = [
    ["target/x86_64-unknown-linux-gnu/release/musializer-rs", "usr/bin/", "755"],
    ["../../assets/icon.png", "usr/share/icons/hicolor/256x256/apps/musializer-rs.png", "644"],
    ["../../distribution/org.musializer.MusializerRS.desktop", "usr/share/applications/musializer-rs.desktop", "644"],
]

[package.metadata.bundle]
name = "Musializer-RS"
identifier = "org.musializer.MusializerRS"
icon = ["../../assets/icon.png"]
version = "1.0.0"
copyright = "Copyright (c) 2026 G Abin Roy"
category = "Music"
short_description = "High-Performance Audio Visualizer"

[dependencies]
musializer-core = { path = "../musializer-core" }
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
eframe = { version = "0.28.1", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.28.1"
env_logger = "0.11.11"
log = "0.4.34"
rfd = "0.17.2"
rustfft = "6.4.1"
symphonia = { version = "0.5.4", features = ["all"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "ico",
    "tiff",
] }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
self_update = { version = "0.41", default-features = false, features = [
    "rustls",
    "archive-tar",
    "archive-zip",
    "compression-zip-bzip2",
    "compression-zip-deflate",
    "compression-flate2",
] }
