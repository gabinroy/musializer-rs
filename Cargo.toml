[package]
name = "musializer-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "musializer-rs"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
eframe = { version = "0.28.1", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.28.1"
env_logger = "0.11.11"
log = "0.4.34"
rfd = "0.17.2"
rustfft = "6.4.1"
symphonia = { version = "0.5.4", features = ["all"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "ico",
    "tiff",
] }

[package.metadata.bundle]
name = "Musializer-RS"
identifier = "com.musializer.musializer-rs"
icon = ["assets/icon.png"]
version = "0.1.0"
category = "Music"
short_description = "High-Performance Audio Visualizer"
long_description = """
Musializer-RS is a real-time, high-performance cross-platform audio visualization tool built with Rust and egui.
"""
