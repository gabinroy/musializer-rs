[package]
name = "musializer-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "musializer-rs"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
eframe = { version = "0.28.1", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "android-native-activity",
] }
egui = "0.28.1"
env_logger = "0.11.11"
log = "0.4.34"
rustfft = "6.4.1"
symphonia = { version = "0.5.4", features = ["all"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "ico",
    "tiff",
] }

# Desktop (Linux, Windows, macOS) specific dependencies
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
rfd = "0.17.2"

# Web (WASM) specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "Window",
    "Document",
    "HtmlCanvasElement",
    "File",
    "FileList",
    "FileReader",
    "Event",
    "console",
] }
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.2", features = ["js"] }

# Android specific configuration
[package.metadata.android]
package = "com.musializer.app"
apk_label = "Musializer-RS"
target_sdk_version = 34
min_sdk_version = 24
version_code = 1
version_name = "0.1.0"
assets = "assets"
runtime_permissions = [
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.READ_MEDIA_AUDIO",
    "android.permission.MODIFY_AUDIO_SETTINGS"
]

[package.metadata.android.application]
label = "Musializer-RS"
theme = "@android:style/Theme.NoTitleBar.Fullscreen"
